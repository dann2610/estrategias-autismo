{% if obj.is_public %}
<div class="d-flex flex-wrap gap-2 mt-3">
  {% if user.is_authenticated %}
  <form method="post" action="{% url 'core:favorite' obj.model_key obj.pk %}">{% csrf_token %}
    <button class="btn btn-soft btn-sm" type="submit" aria-pressed="{{ is_favorite|yesno:'true,false' }}"><i class="bi bi-bookmark{% if is_favorite %}-fill{% endif %}" aria-hidden="true"></i> {% if is_favorite %}En tus favoritos{% else %}Guardar en favoritos{% endif %}</button>
  </form>
  <a class="btn btn-soft btn-sm" href="{% url 'reports:create_for' obj.model_key obj.pk %}"><i class="bi bi-flag" aria-hidden="true"></i> Reportar un problema</a>
  {% else %}
  <a class="btn btn-soft btn-sm" href="{% url 'accounts:login' %}?next={{ request.path }}"><i class="bi bi-bookmark" aria-hidden="true"></i> Ingresa para guardar</a>
  {% endif %}
</div>
{% else %}
<div class="callout mt-3 small"><strong>Vista previa privada.</strong> Este contenido no es público (estado: {{ obj.get_status_display }}). Solo lo ven su autor y el equipo de moderación.</div>
{% endif %}
