# Blueprint de Render: crea la base de datos PostgreSQL y el servicio web.
# En Render: New + > Blueprint > elegir este repositorio.
databases:
  - name: estrategias-autismo-db
    plan: free
    databaseName: estrategias_autismo
    user: estrategias_autismo

services:
  - type: web
    name: estrategias-autismo
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: estrategias-autismo-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost"
      - key: DJANGO_HSTS_SECONDS
        value: "3600"
      - key: SITE_CONTACT_EMAIL
        value: "contacto@ejemplo.org"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
